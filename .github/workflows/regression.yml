name: PHP regression checks
on:
  pull_request:
    branches: [master]
  push:
    branches: ['dev/profit-engine-phase-1']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, openssl, curl, zip, simplexml
          coverage: none
      - name: PHP syntax
        run: find includes public_html scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Regression tests
        run: |
          php scripts/test-profit.php
          php scripts/test-trendyol-v2.php
          php scripts/test-money-input.php
          php scripts/test-order-estimate.php
          php scripts/test-product-profit.php
          php scripts/test-payout.php
          php scripts/test-db-safety.php
          php scripts/test-api-contract.php
      - name: Isolated HTTP smoke test
        run: python3 scripts/test-http-smoke.py
      - name: JavaScript syntax
        run: node --check public_html/assets/app.js
