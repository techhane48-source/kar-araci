<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;width:330px;padding:16px;color:#0f172a}
  h1{font-size:16px;font-weight:800} h1 span{color:#2563eb}
  #st{margin:6px 0 14px;font-size:12px;color:#475569} #st.ok{color:#15803d} #st.err{color:#b91c1c}
  #st a{color:#2563eb;cursor:pointer}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
  label{display:block;font-size:11px;color:#475569;font-weight:600;margin-bottom:3px}
  input{width:100%;padding:7px 8px;border:1px solid #cbd5e1;border-radius:7px;font-size:13px}
  button{width:100%;margin-top:4px;padding:9px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}
  #res{margin-top:12px;padding:12px;border-radius:10px;background:#f1f5f9;display:none}
  #res .v{font-size:22px;font-weight:800} #res.pos{background:#dcfce7} #res.neg{background:#fee2e2}
  #res .d{font-size:11.5px;color:#475569;margin-top:4px}
  .note{margin-top:12px;font-size:11.5px;color:#64748b}
</style>
</head>
<body>
  <h1>Kâr<span>&amp;</span>Fiyat</h1>
  <div id="st">Bağlantı kontrol ediliyor…</div>
  <div class="two">
    <div><label>Maliyet (KDV dahil)</label><input id="cost" inputmode="decimal"></div>
    <div><label>Satış fiyatı</label><input id="price" inputmode="decimal"></div>
  </div>
  <div class="two">
    <div><label>Komisyon %</label><input id="rate" inputmode="decimal"></div>
    <div><label>KDV %</label><input id="kdv" inputmode="decimal" value="20"></div>
  </div>
  <div class="two">
    <div><label>Kargo (KDV dahil)</label><input id="cargo" inputmode="decimal"></div>
    <div></div>
  </div>
  <button id="calc">Net kârı hesapla</button>
  <div id="res"><div class="v" id="v"></div><div class="d" id="d"></div></div>
  <div class="note">Hesap sunucuda yapılır: net KDV, %1 stopaj, hizmet bedeli ve ayarlarındaki sabit gider dahil. Trendyol tarife sayfalarında kâr her seçeneğin altında kendiliğinden görünür.</div>
  <script src="popup.js"></script>
</body>
</html>
