<!DOCTYPE html>
<html lang="tr">
<head><meta charset="UTF-8"><title>Kâr&amp;Fiyat eklenti ayarları</title>
<style>
  body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;max-width:560px;margin:40px auto;padding:0 20px;color:#0f172a}
  h1{font-size:20px;margin:0 0 4px} p{color:#475569;margin:0 0 20px}
  label{display:block;font-weight:600;font-size:13px;margin:14px 0 4px}
  input{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px}
  button{margin-top:18px;padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
  #st{margin-top:14px;font-weight:600} .ok{color:#15803d} .err{color:#b91c1c}
</style></head>
<body>
  <h1>Kâr&amp;Fiyat eklenti ayarları</h1>
  <p>Kâr&amp;Fiyat'ta <b>Ayarlar → Chrome eklentisi</b> bölümündeki sunucu adresini ve erişim anahtarını buraya yapıştır.</p>
  <label for="url">Sunucu adresi</label>
  <input id="url" placeholder="https://alanadin.com/api-eklenti.php" autocomplete="off">
  <label for="token">Erişim anahtarı</label>
  <input id="token" placeholder="kf_…" autocomplete="off">
  <button id="save">Kaydet ve bağlantıyı dene</button>
  <div id="st"></div>
  <script src="options.js"></script>
</body></html>
